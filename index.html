<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphite · 3D Graphing Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg class="brand-glyph" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 13 L12 3.5" stroke="currentColor" stroke-width="2.4"/>
          <path d="M12 13 L4 19" stroke="currentColor" stroke-width="2.4" opacity=".62"/>
          <path d="M12 13 L20.5 17.5" stroke="currentColor" stroke-width="2.4" opacity=".38"/>
        </svg>
        <span class="brand-name">Graphite</span>
      </div>
      <div class="topbar-actions">
        <div class="examples-wrap">
          <button class="btn" id="btn-examples" title="Library of Calc III examples">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h13.5v13.5H6a2 2 0 0 0-2 2zm0 0A2.5 2.5 0 0 0 6.5 22H19.5v-4.5"/></svg>
            Library
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu" id="examples-menu" hidden></div>
        </div>
        <button class="btn icon-btn" id="btn-settings" title="Graph settings (bounds, axes)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.4 4.6a1.7 1.7 0 0 1 3.2 0l.2.7a1.7 1.7 0 0 0 2.5 1l.6-.3a1.7 1.7 0 0 1 2.3 2.3l-.3.6a1.7 1.7 0 0 0 1 2.5l.7.2a1.7 1.7 0 0 1 0 3.2l-.7.2a1.7 1.7 0 0 0-1 2.5l.3.6a1.7 1.7 0 0 1-2.3 2.3l-.6-.3a1.7 1.7 0 0 0-2.5 1l-.2.7a1.7 1.7 0 0 1-3.2 0l-.2-.7a1.7 1.7 0 0 0-2.5-1l-.6.3a1.7 1.7 0 0 1-2.3-2.3l.3-.6a1.7 1.7 0 0 0-1-2.5l-.7-.2a1.7 1.7 0 0 1 0-3.2l.7-.2a1.7 1.7 0 0 0 1-2.5l-.3-.6a1.7 1.7 0 0 1 2.3-2.3l.6.3a1.7 1.7 0 0 0 2.5-1z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="btn icon-btn" id="btn-shot" title="Save a PNG of the graph">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c0-1.1.9-2 2-2h1.5l1.2-1.8c.2-.3.5-.5.9-.5h4.8c.4 0 .7.2.9.5L16.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
        </button>
        <button class="btn icon-btn" id="btn-theme" title="Toggle light / dark theme">
          <svg class="ic-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 7.5 7.5 0 1 0 20 13.5z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </div>
    </header>

    <aside id="panel">
      <div id="panel-tools">
        <div class="add-wrap">
          <button class="add-btn" id="btn-add" title="Add an expression to the graph">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu" id="add-menu" hidden></div>
        </div>
        <span class="tools-hint">Expressions</span>
      </div>
      <div id="items"></div>
    </aside>

    <main id="stage">
      <div id="viewport"></div>
      <div id="hud-tr">
        <button class="hud-btn" id="btn-inspect" title="Inspect: click a surface for tangent plane, gradient & partial derivatives">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/><path d="M11 8v6M8 11h6"/></svg>
        </button>
      </div>
      <div id="hud-br">
        <button class="hud-btn" id="btn-zoom-in" title="Zoom in"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="hud-btn" id="btn-zoom-out" title="Zoom out"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="hud-btn" id="btn-home" title="Reset view"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></button>
      </div>
      <div id="inspect-card" hidden></div>
      <div id="settings-pop" hidden></div>
      <div id="toast" hidden></div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
