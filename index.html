<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphite · 3D Graphing Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <nav id="activitybar">
      <button class="act-btn active" id="act-expr" title="Expressions">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button class="act-btn" id="btn-examples" title="Library — Calc III scenes">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h13.5v13.5H6a2 2 0 0 0-2 2zm0 0A2.5 2.5 0 0 0 6.5 22H19.5v-4.5"/></svg>
      </button>
      <div class="act-spacer"></div>
      <button class="act-btn" id="btn-shot" title="Save a PNG of the graph">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c0-1.1.9-2 2-2h1.5l1.2-1.8c.2-.3.5-.5.9-.5h4.8c.4 0 .7.2.9.5L16.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
      </button>
      <button class="act-btn" id="btn-theme" title="Toggle light / dark theme">
        <svg class="ic-moon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 7.5 7.5 0 1 0 20 13.5z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button class="act-btn" id="btn-settings" title="Graph window & view settings">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10.4 4.6a1.7 1.7 0 0 1 3.2 0l.2.7a1.7 1.7 0 0 0 2.5 1l.6-.3a1.7 1.7 0 0 1 2.3 2.3l-.3.6a1.7 1.7 0 0 0 1 2.5l.7.2a1.7 1.7 0 0 1 0 3.2l-.7.2a1.7 1.7 0 0 0-1 2.5l.3.6a1.7 1.7 0 0 1-2.3 2.3l-.6-.3a1.7 1.7 0 0 0-2.5 1l-.2.7a1.7 1.7 0 0 1-3.2 0l-.2-.7a1.7 1.7 0 0 0-2.5-1l-.6.3a1.7 1.7 0 0 1-2.3-2.3l.3-.6a1.7 1.7 0 0 0-1-2.5l-.7-.2a1.7 1.7 0 0 1 0-3.2l.7-.2a1.7 1.7 0 0 0 1-2.5l-.3-.6a1.7 1.7 0 0 1 2.3-2.3l.6.3a1.7 1.7 0 0 0 2.5-1z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </nav>

    <aside id="panel">
      <div id="expr-view" class="side-view">
        <div class="side-head">
          <span class="side-title">Expressions</span>
          <span class="side-actions">
            <button class="chip-btn" id="btn-add" title="Add expression  ( / )">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </span>
        </div>
        <div id="items"></div>
      </div>
      <div id="library-view" class="side-view" hidden>
        <div class="side-head">
          <span class="side-title">Library</span>
        </div>
        <div id="library-list"></div>
      </div>
    </aside>

    <main id="stage">
      <div id="tabstrip">
        <div class="tab active">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 L12 3.5" stroke="currentColor" stroke-width="2.4"/><path d="M12 13 L4 19" stroke="currentColor" stroke-width="2.4" opacity=".62"/><path d="M12 13 L20.5 17.5" stroke="currentColor" stroke-width="2.4" opacity=".38"/></svg>
          Graph 3D
        </div>
        <span class="tab-title">Graphite</span>
      </div>
      <div id="viewport"></div>
      <div id="hud-tr">
        <button class="hud-btn" id="btn-inspect" title="Inspect: click a surface for tangent plane, gradient & partial derivatives">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/><path d="M11 8v6M8 11h6"/></svg>
        </button>
      </div>
      <div id="hud-br">
        <button class="hud-btn" id="btn-zoom-in" title="Zoom in"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="hud-btn" id="btn-zoom-out" title="Zoom out"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="hud-btn" id="btn-home" title="Reset view"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></button>
      </div>
      <div id="inspect-card" hidden></div>
      <div id="settings-pop" hidden></div>
      <div id="toast" hidden></div>
      <div id="add-menu" class="menu quickpick" hidden></div>
    </main>

    <footer id="statusbar">
      <span class="sb-item" id="sb-status">Ready</span>
      <span class="sb-item" id="sb-count"></span>
      <span class="sb-spacer"></span>
      <span class="sb-item" id="sb-bounds"></span>
      <span class="sb-item">aniketh.net/graphite</span>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
