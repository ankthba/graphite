<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphite · 3D Graphing Calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23005fb8'/%3E%3Cg stroke='%23ffffff' stroke-width='6.5' stroke-linecap='round'%3E%3Cpath d='M32 36 L32 11'/%3E%3Cpath d='M32 36 L13 51' opacity='.75'/%3E%3Cpath d='M32 36 L52 47' opacity='.55'/%3E%3C/g%3E%3Ccircle cx='32' cy='36' r='4.5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <nav id="activitybar">
      <button class="act-btn active" id="act-expr" title="Expressions">
        <span class="codicon codicon-list-unordered"></span>
      </button>
      <button class="act-btn" id="btn-examples" title="Library — Calc III scenes">
        <span class="codicon codicon-library"></span>
      </button>
      <button class="act-btn" id="btn-explore" title="Explorations — guided Calc III concept demos">
        <span class="codicon codicon-compass"></span>
      </button>
      <div class="act-spacer"></div>
      <button class="act-btn" id="btn-shot" title="Save a PNG of the graph">
        <span class="codicon codicon-device-camera"></span>
      </button>
      <button class="act-btn" id="btn-theme" title="Toggle light / dark theme">
        <span class="codicon codicon-color-mode"></span>
      </button>
      <button class="act-btn" id="btn-settings" title="Graph window & view settings">
        <span class="codicon codicon-settings-gear"></span>
      </button>
    </nav>

    <aside id="panel">
      <div id="expr-view" class="side-view">
        <div class="side-head">
          <span class="side-title">Expressions</span>
          <span class="side-actions">
            <button class="chip-btn" id="btn-add" title="Add expression  ( / )">
              <span class="codicon codicon-add"></span>
            </button>
          </span>
        </div>
        <div id="items"></div>
      </div>
      <div id="library-view" class="side-view" hidden>
        <div class="side-head">
          <span class="side-title">Library</span>
        </div>
        <div id="library-list"></div>
      </div>
      <div id="explore-view" class="side-view" hidden>
        <div class="side-head">
          <span class="side-title">Explorations</span>
        </div>
        <div id="explore-list"></div>
      </div>
    </aside>

    <main id="stage">
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="tab-add" title="New scene"><span class="codicon codicon-add"></span></button>
        <span class="tab-title">Graphite</span>
      </div>
      <div id="viewport"></div>
      <div id="hud-tr">
        <button class="hud-btn" id="btn-inspect" title="Inspect — tangent plane, gradient &amp; partials on z = f(x,y) surfaces; ∇F on level surfaces; div/curl + flow lines on vector fields">
          <span class="codicon codicon-inspect"></span>
        </button>
      </div>
      <div id="hud-br">
        <button class="hud-btn" id="btn-2d" title="Toggle flat 2D view — toggling back returns your 3D camera exactly where it was">2D</button>
        <button class="hud-btn" id="btn-zoom-in" title="Zoom in"><span class="codicon codicon-zoom-in"></span></button>
        <button class="hud-btn" id="btn-zoom-out" title="Zoom out"><span class="codicon codicon-zoom-out"></span></button>
        <button class="hud-btn" id="btn-home" title="Reset view"><span class="codicon codicon-home"></span></button>
      </div>
      <div id="inspect-card" hidden></div>
      <div id="explore-card" hidden></div>
      <div id="settings-pop" hidden></div>
      <div id="toast" hidden></div>
      <div id="add-menu" class="menu quickpick" hidden></div>
    </main>

    <footer id="statusbar">
      <span class="sb-item" id="sb-status">✓ Ready</span>
      <span class="sb-item" id="sb-count"></span>
      <span class="sb-item" id="sb-inspect"></span>
      <span class="sb-spacer"></span>
      <span class="sb-item" id="sb-bounds"></span>
      <a class="sb-item sb-link" href="https://github.com/ankthba/graphite" target="_blank" rel="noopener" title="Source on GitHub">
        <span class="codicon codicon-github-alt"></span> graphite
      </a>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
